# Source registry — Writing Coach craft library (working/draft)
#
# Deduplicated source list. Individual documents cite these by `id` in their
# `source_ids` front matter instead of repeating bibliographic details.
# `source_type` values: book, blog, research-report, forum, encyclopedia,
# internal-research, academic.
#
# This file is a draft production artifact. It is not the 4.17 schema and
# does not imply author vetting of any cited claim.

sources:
  # --- Internal research inputs (this repo) ---
  - id: src.internal.litrpg-genre-research
    title: "LitRPG Genre Research — Taxonomy and Platform"
    org_or_author: Worldbuilding Desk (internal)
    location: docs/research-litrpg-genre.md
    source_type: internal-research
    access_date: 2026-08-31
    supports: >
      Subgenre taxonomy, umbrella relationships (GameLit/LitRPG/progression
      fantasy), platform/market conventions, subgenre pattern modifiers.
    confidence_note: >
      Working input corrected by this drafting pass, not a settled source in
      its own right. Individual claims trace back to its cited sources where
      possible; platform-conventions claims remain vendor-reported.

  - id: src.internal.litrpg-craft-failures-research
