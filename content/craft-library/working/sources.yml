  # --- Added 2026-09-05: mana history (closes the Batch 3 etymology gap) ---
  - id: src.book.codrington-melanesians
    title: "The Melanesians: Studies in their Anthropology and Folk-Lore"
    org_or_author: Robert Henry Codrington
    publisher: "Clarendon Press, 1891"
    source_type: book
    access_date: 2026-09-05
    supports: >
      The nineteenth-century missionary-ethnographic account that introduced
      "mana" to English-language scholarship, describing it as a supernatural
      power or influence attaching to persons and things.
    confidence_note: >
      Primary historical source, and a contested one — later scholarship
      (see Keesing) holds that Codrington misconstrued the term's grammar.
      Cited here for what Codrington wrote and its influence, never as an
      accurate account of Oceanic usage. **This drafting pass did not read
      the 1891 text directly**; it works from the passage Codrington is
      quoted on in Golub's account plus bibliographic verification.

  - id: src.article.keesing-rethinking-mana
    title: "Rethinking Mana"
    org_or_author: Roger M. Keesing
    publisher: "Journal of Anthropological Research 40(1), 1984, pp. 137-156"
    source_type: academic
    access_date: 2026-09-05
    supports: >
      The argument that mana in Proto-Oceanic was canonically a stative verb
      — to be efficacious, to succeed, to work — and that its noun uses are
      abstract verbal nouns, so mana names a condition inferred from outcomes
      rather than a substance a person holds. Also the claim that Codrington's
      reading of mana as a noun derailed later scholarship.
    confidence_note: >
      Peer-reviewed anthropological article, widely cited and itself part of a
      continuing debate rather than a settled last word. **This pass did not
      read the full article**; it works from the journal record and from
      Keesing's argument as summarized in the secondary literature, and the
      record cites him only for that central claim.

  - id: src.chapter.golub-peterson-mana-video-game
    title: "How Mana Left the Pacific and Became a Video Game Mechanic"
    org_or_author: Alex Golub and Jon Peterson
    publisher: >
      In Matt Tomlinson and Ty P. Kawika Tengan (eds), New Mana:
      Transformations of a Classic Concept in Pacific Languages and Cultures,
      ANU Press, 2016 (open access)
