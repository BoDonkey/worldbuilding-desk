  # --- Established general craft works (books) ---
  - id: src.book.mckee-story
    title: "Story: Substance, Structure, Style, and the Principles of Screenwriting"
    org_or_author: Robert McKee
    publisher: ReganBooks, 1997
    source_type: book
    supports: >
      Scene structure (value shift, conflict, turn), controlling idea, story
      causality, negation of the negation, exposition discipline.
    confidence_note: >
      Widely taught screenwriting/story-structure text; adapted here for
      prose fiction rather than quoted directly.

  - id: src.book.swain-techniques-selling-writer
    title: "Techniques of the Selling Writer"
    org_or_author: Dwight V. Swain
    publisher: University of Oklahoma Press, 1965
    source_type: book
    supports: "Scene/sequel structure (goal-conflict-disaster / reaction-dilemma-decision)."
    confidence_note: >
      Foundational, still widely taught source for the scene/sequel model;
      original terminology paraphrased, not quoted.

  - id: src.book.snyder-save-the-cat
    title: "Save the Cat! The Last Book on Screenwriting You'll Ever Need"
    org_or_author: Blake Snyder
    publisher: Michael Wiese Productions, 2005
    source_type: book
    supports: "Beat-sheet structure as one school of plot architecture, midpoint function."
    confidence_note: >
      Popular, prescriptive structure model; presented in this library as one
      school among several, not the universal shape of a novel.

  - id: src.book.truby-anatomy-of-story
    title: "The Anatomy of Story: 22 Steps to Becoming a Master Storyteller"
    org_or_author: John Truby
    publisher: Faber and Faber, 2007
    source_type: book
    supports: "Premise/controlling idea, character web, moral argument, revelation."
    confidence_note: Established, widely taught structure text.

  - id: src.book.cron-story-genius
    title: "Story Genius: How to Use Brain Science to Go Beyond Outlining"
    org_or_author: Lisa Cron
    publisher: Ten Speed Press, 2016
    source_type: book
    supports: "Want/need distinction, misbelief, internal-external arc alignment."
    confidence_note: Established contemporary craft text, cognitive-science framing.

  - id: src.book.cron-wired-for-story
    title: "Wired for Story"
    org_or_author: Lisa Cron
    publisher: Ten Speed Press, 2012
    source_type: book
    supports: "Reader engagement mechanics, cause-and-effect, tension."
    confidence_note: Established contemporary craft text.

  - id: src.book.vogler-writers-journey
    title: "The Writer's Journey: Mythic Structure for Writers"
    org_or_author: Christopher Vogler
    publisher: Michael Wiese Productions, 1992
    source_type: book
    supports: "Mentor, threshold guardian, and hero archetypes; call/refusal structure."
    confidence_note: >
      Popularization of Campbell's monomyth; presented as one lens, not a
      universal template.

  - id: src.book.campbell-hero-with-a-thousand-faces
    title: "The Hero with a Thousand Faces"
    org_or_author: Joseph Campbell
    publisher: Pantheon Books, 1949
    source_type: book
    supports: "Monomyth structure, archetypal figures (mentor, threshold guardian, herald)."
    confidence_note: >
      Comparative-mythology synthesis, contested by later scholars as
      overgeneralized across cultures; used here as one influential lens.

  - id: src.book.propp-morphology-of-the-folktale
    title: "Morphology of the Folktale"
    org_or_author: Vladimir Propp
    publisher: (Russian orig. 1928; Univ. of Texas Press trans. 1968)
    source_type: academic
    supports: "Character function taxonomy (villain, donor, helper, princess, dispatcher)."
    confidence_note: >
      Structuralist analysis of a specific corpus (Russian folktales); useful
      for function-based trope naming, not a universal grammar of story.

