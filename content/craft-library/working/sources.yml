# Source registry — Writing Coach craft library (working/draft)
#
# Deduplicated source list. Individual documents cite these by `id` in their
# `source_ids` front matter instead of repeating bibliographic details.
# `source_type` values: book, blog, research-report, forum, encyclopedia,
# internal-research, academic.
#
# This file is a draft production artifact. It is not the 4.17 schema and
# does not imply author vetting of any cited claim.

